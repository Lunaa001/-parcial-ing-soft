spring.application.name=IA-Perfume-Advisor

# Database Configuration - Development
spring.datasource.url=jdbc:postgresql://localhost:5432/perfume_advisor
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.root=INFO
logging.level.com.iaperfumeadvisor=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration
jwt.secret=dev-secret-key-here-min-256-bits-long-for-development
jwt.expiration=86400000

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Application Info
app.name=IA Perfume Advisor - Dev
app.version=1.0.0-SNAPSHOT
