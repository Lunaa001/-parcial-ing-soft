# Todo lo sensible sale de variables de entorno. Los valores por defecto son SOLO para desarrollo
# local (PostgreSQL en localhost); en la nube el perfil "cloud" los reemplaza y exige los secretos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/perfume_advisor}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Permite que Flyway adopte un esquema local ya existente (creado antes por ddl-auto=update)
spring.flyway.baseline-on-migrate=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.level=%5p [requestId=%X{requestId:-}]

server.port=8080

# Health publico (lo usan las probes del contenedor); metricas quedan protegidas por login
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET:dev-secret-key-here-min-256-bits-long-for-development}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Groq (nunca hardcodear la key: siempre via variable de entorno). groq/compound tiene
# busqueda web real integrada, asi la IA puede reconocer perfumes de nicho/marca que no
# esten en nuestro catalogo ni en su conocimiento de entrenamiento.
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:groq/compound}
groq.fallback-model=${GROQ_FALLBACK_MODEL:openai/gpt-oss-120b}
groq.extraction-model=${GROQ_EXTRACTION_MODEL:openai/gpt-oss-20b}
groq.api-url=${GROQ_API_URL:https://api.groq.com/openai/v1}

# Numero de WhatsApp del negocio para el link de pedido (formato internacional sin +, ej: 5491122334455)
whatsapp.business-number=${WHATSAPP_BUSINESS_NUMBER:}

# Fotos de productos subidas por el admin
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB