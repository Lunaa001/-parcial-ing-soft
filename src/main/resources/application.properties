spring.datasource.url=jdbc:postgresql://localhost:5432/perfume_advisor
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Permite que Flyway adopte un esquema local ya existente (creado antes por ddl-auto=update)
spring.flyway.baseline-on-migrate=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

server.port=8080

jwt.secret=dev-secret-key-here-min-256-bits-long-for-development
jwt.expiration=86400000

# Groq (nunca hardcodear la key: siempre via variable de entorno). groq/compound tiene
# busqueda web real integrada, asi la IA puede reconocer perfumes de nicho/marca que no
# esten en nuestro catalogo ni en su conocimiento de entrenamiento.
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:groq/compound}
groq.fallback-model=${GROQ_FALLBACK_MODEL:openai/gpt-oss-120b}
groq.api-url=${GROQ_API_URL:https://api.groq.com/openai/v1}

# Numero de WhatsApp del negocio para el link de pedido (formato internacional sin +, ej: 5491122334455)
whatsapp.business-number=${WHATSAPP_BUSINESS_NUMBER:}

# Fotos de productos subidas por el admin
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB