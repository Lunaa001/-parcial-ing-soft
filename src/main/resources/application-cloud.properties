# Perfil de despliegue en la nube: base H2 en memoria (ver DEPLOY.md). Los datos se pierden
# al reiniciar el contenedor; el esquema se crea solo con las migraciones de Flyway.
spring.datasource.url=jdbc:h2:mem:perfume;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.root=WARN
logging.level.com.iaperfumeadvisor=INFO

# Sin fallback: si falta el secreto, la app no arranca en vez de usar el valor de desarrollo
jwt.secret=${JWT_SECRET}

server.port=8080

# Admin inicial: solo se crea si ADMIN_PASSWORD esta definida
admin.default.username=${ADMIN_USERNAME:admin}
admin.default.password=${ADMIN_PASSWORD:}
admin.default.email=${ADMIN_EMAIL:admin@iaperfumeadvisor.com}
