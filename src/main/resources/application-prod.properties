spring.application.name=IA-Perfume-Advisor

# Database Configuration - Production
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# En prod NO se hace baseline automatico: si aparece un esquema no vacio sin
# historial de Flyway, debe fallar y requerir intervencion manual (flyway baseline)
spring.flyway.baseline-on-migrate=false

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.root=WARN
logging.level.com.iaperfumeadvisor=INFO

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Default admin user: solo se crea si ADMIN_PASSWORD esta definida
admin.default.username=${ADMIN_USERNAME:admin}
admin.default.password=${ADMIN_PASSWORD:}
admin.default.email=${ADMIN_EMAIL:admin@iaperfumeadvisor.com}

# Groq (obligatoria en prod, nunca hardcodear la key)
groq.api-key=${GROQ_API_KEY}
groq.model=${GROQ_MODEL:groq/compound}
groq.fallback-model=${GROQ_FALLBACK_MODEL:openai/gpt-oss-120b}
groq.api-url=${GROQ_API_URL:https://api.groq.com/openai/v1}

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=false

# Application Info
app.name=IA Perfume Advisor
app.version=1.0.0
