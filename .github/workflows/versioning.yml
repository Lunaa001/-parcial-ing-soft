name: Semantic Versioning

# En cada push a main, crea un tag vX.Y.Z automático según el mensaje del
# commit (Conventional Commits): breaking change -> major (X), feat -> minor
# (Y), fix/refactor -> patch (Z), doc/chore -> no versiona.
#
# Diferencia con el proyecto de referencia: el cálculo de la versión se movió a
# .github/scripts/version.sh (misma regla), porque ciclo-azure.yml también lo usa
# para etiquetar la imagen Docker con la versión. Así los dos calculan siempre la
# misma versión, y si el commit ya tiene tag (por ejemplo en un re-run) no crea otro.
on:
  push:
    branches: [main]

permissions:
  contents: write # necesario para crear y pushear el tag

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      # Trae todo el historial y los tags existentes (fetch-depth: 0),
      # necesario para poder encontrar el último tag vX.Y.Z.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calcular la versión
        id: version
        env:
          # El mensaje del commit va por env var, no interpolado directo en
          # el script, para evitar command injection.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: bash .github/scripts/version.sh

      - name: Crear y pushear el tag
        if: steps.version.outputs.nueva == 'true'
        env:
          NEW_TAG: ${{ steps.version.outputs.version }}
        run: |
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
