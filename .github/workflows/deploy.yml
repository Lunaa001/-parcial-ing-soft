name: CI/CD - construir, escanear, desplegar y apagar

# Push a main -> automatico. workflow_dispatch -> boton "Run workflow" en la pestana Actions.
# Ciclo normal: build -> Trivy -> crear ACR -> push -> deploy -> prueba de humo -> detener la app
# y borrar el ACR (el ACR Basic cobra por dia mientras existe). Para dejarla prendida: workflow
# "Levantar" o "/keeprunning". Controles en la PRIMERA linea del mensaje del commit:
#   /notdeploy   -> construye, escanea y sube la imagen, pero no despliega ni apaga.
#   /keeprunning -> despliega y deja la app prendida (no detiene ni borra el ACR).
on:
  push:
    branches: [main]
    # Un commit que solo cambia documentacion no levanta la app ni crea el ACR
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

# Comun a deploy, Levantar y Apagar: nunca corren a la vez (Apagar no borra el ACR en medio de un push)
concurrency:
  group: azure-perfume
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    outputs:
      desplegar: ${{ steps.leer.outputs.desplegar }}
      apagar: ${{ steps.leer.outputs.apagar }}
    steps:
      # El mensaje del commit va por variable de entorno (no interpolado en el script) para evitar
      # command injection. Solo cuenta la primera linea: asi un commit que DESCRIBE estos controles
      # en el cuerpo no los activa.
      - name: Leer controles de la primera linea del commit (/notdeploy, /keeprunning)
        id: leer
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          PRIMERA=$(printf '%s\n' "$COMMIT_MSG" | head -n 1)
          desplegar=true
          apagar=true
          if [[ "$PRIMERA" == *"/notdeploy"* ]]; then
            desplegar=false
            apagar=false
            echo "/notdeploy: se construye, escanea y sube la imagen, pero no se despliega ni se apaga."
          elif [[ "$PRIMERA" == *"/keeprunning"* ]]; then
            apagar=false
            echo "/keeprunning: se despliega y la app queda prendida."
          fi
          echo "desplegar=$desplegar" >> "$GITHUB_OUTPUT"
          echo "apagar=$apagar" >> "$GITHUB_OUTPUT"

  ciclo:
    needs: control
    uses: ./.github/workflows/ciclo-azure.yml
    with:
      construir: true
      desplegar: ${{ needs.control.outputs.desplegar == 'true' }}
      apagar: ${{ needs.control.outputs.apagar == 'true' }}
    secrets: inherit
