name: CI/CD - construir y publicar la imagen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: parcial-ing-soft

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login en Azure Container Registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_NAME }}.azurecr.io" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Construir la imagen (Distroless, multi-stage)
        run: docker build -t "${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}" -t "${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:latest" .

      - name: Subir la imagen al registry
        run: |
          docker push "${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}"
          docker push "${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:latest"

  deploy:
    # Requiere AZURE_CREDENTIALS (service principal). Ver DEPLOY.md, seccion "Limitaciones".
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Actualizar la Container App a la imagen nueva
        run: |
          az containerapp update \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}"
