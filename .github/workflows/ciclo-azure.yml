name: Ciclo Azure (reutilizable)

# Logica comun de los workflows deploy.yml, levantar.yml y apagar.yml. El ACR Basic cobra por
# cada dia que existe (y no se puede detener), asi que vive solo mientras la app esta levantada:
# se crea antes del push y se borra al apagar. La Container App y el resource group NUNCA se borran.
on:
  workflow_call:
    inputs:
      construir:
        description: Build, Trivy, crear el ACR si no existe y push
        type: boolean
        required: true
      desplegar:
        description: Credenciales del registry, update de imagen, start y prueba de humo
        type: boolean
        required: true
      apagar:
        description: Al final, detener la app y borrar el ACR (si hubo deploy, solo si la prueba de humo paso)
        type: boolean
        required: true

env:
  IMAGE_NAME: parcial-ing-soft
  # Application Insights (modo workspace) creado una sola vez a mano en el resource group; no se
  # borra al apagar. Si no existe, el deploy sigue sin telemetria y avisa con un warning.
  APPINSIGHTS_NAME: appi-perfume
  # Recursos de la app. Con el agente de Application Insights, 0.25 vCPU / 0.5 GiB no alcanzaba (no
  # llegaba a arrancar en 4,5 min y la memoria del proceso llega a ~390 MB): con 0.5 / 1 GiB arranca
  # en ~50 s. Solo se cobra mientras esta prendida (entra en el cupo gratis de Container Apps).
  APP_CPU: '0.5'
  APP_MEMORY: 1.0Gi

jobs:
  ciclo:
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
    steps:
      - name: Verificar que existen los secretos necesarios
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          faltan=0
          for nombre in AZURE_CREDENTIALS ACR_NAME CONTAINER_APP_NAME RESOURCE_GROUP; do
            if [ -z "${!nombre}" ]; then
              echo "::error::Falta el secreto de GitHub '$nombre'. Ver DEPLOY.md, seccion 'Secretos de GitHub'."
              faltan=1
            fi
          done
          if [[ "$ACR_NAME" == *.azurecr.io* || "$ACR_NAME" =~ [^a-z0-9] ]]; then
            echo "::error::ACR_NAME tiene que ser solo el nombre del registry (minusculas y numeros, sin '.azurecr.io')."
            faltan=1
          fi
          echo "IMAGE=$ACR_NAME.azurecr.io/$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "Modo: construir=${{ inputs.construir }} desplegar=${{ inputs.desplegar }} apagar=${{ inputs.apagar }}"
          exit $faltan

      # Historial completo y tags: hacen falta para calcular la version (ultimo vX.Y.Z)
      - uses: actions/checkout@v7
        if: inputs.construir
        with:
          fetch-depth: 0
          fetch-tags: true

      # Misma regla y mismo script que versioning.yml, asi la imagen y el tag de git coinciden
      - name: Calcular la version semantica
        id: version
        if: inputs.construir
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          bash .github/scripts/version.sh
          VERSION=$(grep '^version=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "### Version: $VERSION (commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar Java 25 (con cache de Gradle)
        if: inputs.construir
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Antes del build y de tocar Azure: si un test falla, el pipeline se frena y el ACR ni se crea.
      # Perfil cloud (H2 en memoria) para no necesitar PostgreSQL. Los valores son de prueba, nunca
      # los reales: la key de Groq invalida solo hace fallar el precalentado (un WARN), no el test.
      - name: Tests (./gradlew test)
        if: inputs.construir
        env:
          SPRING_PROFILES_ACTIVE: cloud
          JWT_SECRET: clave-de-prueba-solo-para-tests-de-ci-0123456789abcdef
          GROQ_API_KEY: gsk_prueba_ci_no_valida
        run: ./gradlew test --no-daemon

      - name: Guardar el reporte de tests si fallan
        if: failure() && inputs.construir
        uses: actions/upload-artifact@v7
        with:
          name: reporte-tests
          path: build/reports/tests/test/
          if-no-files-found: ignore

      - name: Login en Azure (service principal)
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # El build y los escaneos no necesitan el ACR: si Trivy o Grype encuentran un CVE, el ACR ni
      # se crea. Tres tags: version (la que se despliega), SHA del commit y latest. Etiquetas OCI
      # (las mismas que pone ScriptAz.java): version = vX.Y.Z, revision = SHA del commit.
      - name: Construir la imagen (Distroless, multi-stage)
        if: inputs.construir
        run: |
          docker build \
            --label "org.opencontainers.image.title=$IMAGE_NAME" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.description=App $IMAGE_NAME - Azure Container Apps" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      # Fijada por commit (v0.36.0), no por tag, para que nadie pueda cambiar el codigo que corre.
      - name: Escanear la imagen con Trivy (CVEs HIGH/CRITICAL con parche)
        if: inputs.construir
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      # Segundo escaner (otra base de vulnerabilidades) sobre la misma imagen, con el mismo criterio.
      # Fijado por commit (v7.4.2), no por tag.
      - name: Escanear la imagen con Grype (CVEs HIGH/CRITICAL con parche)
        if: inputs.construir
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      # Basic + usuario admin (el entorno Express no admite identidad administrada para el pull).
      # El nombre es global en Azure: recien borrado puede tardar en liberarse, por eso los reintentos.
      - name: Crear el ACR si no existe
        id: acr
        if: inputs.construir
        run: |
          if az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "El ACR $ACR_NAME ya existe."
            echo "creado=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REGION=$(az group show --name "$RESOURCE_GROUP" --query location -o tsv)
          for intento in $(seq 1 20); do
            if az acr create --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --location "$REGION" \
                 --sku Basic --admin-enabled true --output none; then
              echo "ACR $ACR_NAME creado en $REGION (intento $intento)."
              echo "creado=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Intento $intento/20: no se pudo crear el ACR (el nombre puede no estar liberado todavia). Reintento en 30 s."
            sleep 30
          done
          echo "::error::No se pudo crear el ACR $ACR_NAME despues de 10 minutos."
          exit 1

      - name: Subir la imagen al registry
        if: inputs.construir
        run: |
          az acr login --name "$ACR_NAME"
          docker push --all-tags "$IMAGE"
          echo "### Imagen: $IMAGE con tags $VERSION, ${GITHUB_SHA::7}... y latest" >> "$GITHUB_STEP_SUMMARY"

      # La contrasena admin cambia cada vez que se recrea el ACR: se vuelve a cargar en la app. La
      # connection string de Application Insights se sincroniza como secreto (nunca en el codigo).
      - name: Aplicar credenciales del ACR y de Application Insights en la Container App
        if: inputs.desplegar
        run: |
          echo "APP_TOCADA=true" >> "$GITHUB_ENV"
          PASSWORD=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)
          echo "::add-mask::$PASSWORD"
          az containerapp registry set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --server "$ACR_NAME.azurecr.io" \
            --username "$ACR_NAME" \
            --password "$PASSWORD" \
            --output none
          CS=$(az resource show --resource-group "$RESOURCE_GROUP" --name "$APPINSIGHTS_NAME" \
                 --resource-type microsoft.insights/components --query properties.ConnectionString -o tsv 2>/dev/null || true)
          if [ -n "$CS" ]; then
            echo "::add-mask::$CS"
            az containerapp secret set --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --secrets "appinsights-cs=$CS" --output none
            echo "APPINSIGHTS_ENV=APPLICATIONINSIGHTS_CONNECTION_STRING=secretref:appinsights-cs APPLICATIONINSIGHTS_ROLE_NAME=$CONTAINER_APP_NAME" >> "$GITHUB_ENV"
            echo "Connection string de Application Insights cargada como secreto appinsights-cs."
          else
            echo "::warning::No existe Application Insights '$APPINSIGHTS_NAME' en $RESOURCE_GROUP: se despliega sin telemetria."
          fi

      # Orden update -> start: si se prendiera antes, la app intentaria bajar la imagen vieja, que no
      # existe en el ACR recreado. Si Azure no acepta el update con la app detenida, start -> update.
      - name: Desplegar la imagen nueva (update y start)
        if: inputs.desplegar
        run: |
          APP_ID=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query id -o tsv)
          estado() { az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.runningStatus -o tsv; }
          iniciar() {
            az rest --method post --url "https://management.azure.com${APP_ID}/start?api-version=2026-07-01" --output none
            for i in $(seq 1 24); do [ "$(estado)" = "Running" ] && return 0; sleep 5; done
            echo "::warning::La app todavia no figura Running; la prueba de humo sigue esperando."
          }
          # APP_VERSION y GIT_SHA dejan visible que codigo corre y fuerzan una revision nueva aunque la
          # version no cambie (un commit chore: reusa el ultimo tag)
          actualizar() {
            # shellcheck disable=SC2086
            az containerapp update --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE:$VERSION" \
              --cpu "$APP_CPU" --memory "$APP_MEMORY" \
              --set-env-vars APP_VERSION="$VERSION" GIT_SHA="${{ github.sha }}" $APPINSIGHTS_ENV \
              --output none
          }
          INICIAL=$(estado)
          echo "Estado inicial de la app: $INICIAL"
          if actualizar; then
            ORDEN="update -> start"
            if [ "$INICIAL" = "Stopped" ]; then
              iniciar
            fi
          elif [ "$INICIAL" = "Stopped" ]; then
            ORDEN="start -> update"
            echo "::warning::Azure no acepto el update con la app detenida: se usa start -> update."
            iniciar
            actualizar
          else
            echo "::error::Fallo el update de la imagen."
            exit 1
          fi
          echo "Orden usado: $ORDEN"
          echo "### Orden de despliegue: $ORDEN (estado inicial: $INICIAL)" >> "$GITHUB_STEP_SUMMARY"

      # Despues del update la revision nueva puede responder 503 mientras arranca. Ademas se exige
      # que la revision activa ya tenga la imagen de esta version Y el GIT_SHA de este commit, para no
      # aceptar el UP de la revision vieja (que puede tener la misma version si el commit no la subio).
      - name: Prueba de humo (/actuator/health)
        id: humo
        if: inputs.desplegar
        run: |
          FQDN=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for intento in $(seq 1 10); do
            estado=$(az containerapp revision list --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.active && properties.template.containers[0].image=='$IMAGE:$VERSION' && properties.template.containers[0].env[?name=='GIT_SHA' && value=='${{ github.sha }}'] | [0].value == '${{ github.sha }}'].properties.healthState | [0]" -o tsv)
            codigo=$(curl -s -o respuesta.json -w '%{http_code}' "https://$FQDN/actuator/health" || true)
            echo "Intento $intento/10: revision con la imagen nueva=${estado:-todavia no} | HTTP $codigo $(cat respuesta.json 2>/dev/null)"
            if [ "$estado" = "Healthy" ] && [ "$codigo" = "200" ] && grep -q '"UP"' respuesta.json; then
              echo "La app responde UP en https://$FQDN con la imagen $VERSION (${{ github.sha }})"
              echo "### La app responde UP en https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::La app no respondio UP en /actuator/health despues de 10 intentos. Queda prendida para revisar los logs (DEPLOY.md, 'Verificar que el contenedor corre') y despues correr el workflow 'Apagar'."
          exit 1

      # Si hubo deploy, solo se apaga si la prueba de humo paso (si fallo, queda prendida para revisar).
      - name: Apagar (detener la app y borrar el ACR)
        if: inputs.apagar && (!inputs.desplegar || steps.humo.outcome == 'success')
        run: |
          APP_ID=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query id -o tsv)
          estado() { az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.runningStatus -o tsv; }
          if [ "$(estado)" != "Stopped" ]; then
            az rest --method post --url "https://management.azure.com${APP_ID}/stop?api-version=2026-07-01" --output none
          fi
          for i in $(seq 1 24); do [ "$(estado)" = "Stopped" ] && break; sleep 5; done
          FINAL=$(estado)
          echo "runningStatus: $FINAL"
          if [ "$FINAL" != "Stopped" ]; then
            echo "::error::La app no quedo Stopped (estado: $FINAL). No se borra el ACR."
            exit 1
          fi
          if az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --output none 2>/dev/null; then
            az acr delete --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --yes --output none
            echo "ACR $ACR_NAME borrado."
          else
            echo "El ACR $ACR_NAME ya no existia."
          fi
          echo "### Apagado: app Stopped y ACR borrado (sin costo)" >> "$GITHUB_STEP_SUMMARY"

      # Si algo fallo despues de crear el ACR y antes de tocar la app (por ejemplo el push), el ACR
      # recien creado no sirve para nada y cobra: se borra. Uno que ya existia no se toca.
      - name: Limpieza (borrar el ACR creado si fallo antes de desplegar)
        if: failure() && steps.acr.outputs.creado == 'true' && env.APP_TOCADA != 'true'
        run: |
          az acr delete --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --yes --output none
          echo "ACR $ACR_NAME borrado: fallo un paso antes de desplegar y la app no se toco."

      - name: Logout from Azure
        if: always()
        run: az logout || true
